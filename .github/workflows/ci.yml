        run: nix build -L .#checks.x86_64-linux.remote-hands-fmt
      - name: Check remote-hands-golden-test-openapi-spec
        if: always()
        run: nix build -L .#checks.x86_64-linux.remote-hands-golden-test-openapi-spec
      - name: Check remote-hands-hakari
        if: always()
        run: nix build -L .#checks.x86_64-linux.remote-hands-hakari
      - name: Check remote-hands-remote-auxiliary
        if: always()
        run: nix build -L .#checks.x86_64-linux.remote-hands-remote-auxiliary
      - name: Check remote-hands-remote-power
        if: always()
        run: nix build -L .#checks.x86_64-linux.remote-hands-remote-power
      - name: Check remote-hands-remote-serial-echo
