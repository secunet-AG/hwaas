name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Run license check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: License check
        run: nix run .#apps.x86_64-linux.lint-SPDX-license-header
  build:
    name: Build nix packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build aruba-switch-mock
        run: nix build -L .#packages.x86_64-linux.aruba-switch-mock
      - name: Build contextapi
        run: nix build -L .#packages.x86_64-linux.contextapi
      - name: Build contextapi-cors-test-debug
        run: nix build -L .#packages.x86_64-linux.contextapi-cors-test-debug
