] }
tower-http = { version = "0.5.2", default-features = false, features = [
  "cors",
  "trace",
  "request-id",
  "limit",
  "timeout",
] }
tracing = { version = "0.1", default-features = false }
tracing-journald = { version = "0.3.0", default-features = false }
tracing-opentelemetry = { version = "0.28.0", default-features = false, features = [
