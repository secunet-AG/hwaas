[workspace]
resolver = "3"
members = [
  "aruba-switch-mock",
  "contextapi/context_data_structures",
  "contextapi/contextapi",
  "contextapi/db_interaction",
  "contextapi/error_utils",
  "contextapi/image_api",
  "contextapi/machine_ops",
  "contextapi/machine_ops_lib",
  "contextapi/net_ctrl_client",
  "contextapi/net_ctrl_client_wrapper",
  "contextapi/remote_client",
  "hunt",
  "net-ctrl",
  "remote-hands/remote-*",
  "rpi-status-display",
  "workspace-hack",
  "ws-gateway",
  "ws-proxy-client",
]

[workspace.package]
authors = ["secunet Security Networks AG <https://www.secunet.com>"]
edition = "2024"
license = "Apache-2.0"
publish = false
readme = "../README.md"
repository = "https://github.com/secunet-AG/hwaas"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# NOTE: Due to some weird interaction in the Rust toolchain it's not currently possible to "forbid"
# clippy lints unconditionally. See: <https://github.com/rust-lang/rust/issues/81670>
all = "deny"

[workspace.dependencies]
afpacket = { version = "0.2.3", default-features = false, features = [
  "async-tokio",
] }
aide = { version = "0.13.5", default-features = false, features = [
  "axum",
  "axum-multipart",
  "axum-extra",
  "axum-headers",
  "axum-ws",
  "macros",
] }
anyhow = { version = "1", default-features = false, features = ["std"] }
assert_cmd = { version = "2", default-features = false }
assert_fs = { version = "1", default-features = false }
assert-json-diff = { version = "2", default-features = false }
async-compression = { version = "0.4", default-features = false, features = [
  "zstd",
  "tokio",
] }
async-stream = { version = "0.3.5", default-features = false }
async-trait = { version = "0.1.53", default-features = false }
axum = { version = "0.7", default-features = false, features = [
  "ws",
  "macros",
  "json",
  "multipart",
] }
axum-extra = { version = "0.9.6", default-features = false, features = [
  "typed-header",
] }
axum-test = { version = "16.4.1", default-features = false, features = ["ws"] }
axum-tracing-opentelemetry = { version = "0.24.0", default-features = false }
base64 = { version = "0.22.1", default-features = false }
bytes = { version = "1.11.1", default-features = false }
bytesize = { version = "2.0.1", default-features = false, features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
  "serde",
] }
clap = { version = "4.3.4", default-features = false, features = [
  "derive",
  "help",
  "usage",
  "std",
] }
console-subscriber = { version = "0.4.1", default-features = false }
context_data_structures = { path = "./contextapi/context_data_structures/" }
contextapi = { path = "./contextapi/contextapi/" }
dashmap = { version = "6.2", default-features = false, features = ["serde"] }
db_interaction = { path = "./contextapi/db_interaction/" }
deadpool-diesel = { version = "0.6", default-features = false, features = [
  "sqlite",
  "rt_tokio_1",
] }
diesel = { version = "2", default-features = false, features = [
  "chrono",
  "sqlite",
  "returning_clauses_for_sqlite_3_35",
] }
diesel_migrations = { version = "2", default-features = false, features = [
  "sqlite",
] }
either = { version = "1", default-features = false, features = ["use_std"] }
embedded-graphics = { version = "0.8.0", default-features = false }
embedded-hal = { version = "1.0.0-alpha.9", default-features = false }
enum_dispatch = { version = "0.3", default-features = false }
error-stack = { version = "0.8", default-features = false }
error_utils = { path = "contextapi/error_utils/" }
etherparse = { version = "0.21", default-features = false }
futures = { version = "0.3", default-features = false, features = [
  "async-await",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hidg = { version = "0.2.0", default-features = false, features = [
  "keyboard",
  "mouse",
] }
http = { version = "1.1.0", default-features = false }
hunt = { path = "./hunt" }
image_api = { path = "./contextapi/image_api/" }
init-tracing-opentelemetry = { version = "0.24.2", default-features = false, features = [
  "tracing_subscriber_ext",
  "otlp",
] }
itertools = { version = "0.13.0", default-features = false, features = [
  "use_std",
] }
libc = { version = "0.2.132", default-features = false }
machine_ops_lib = { path = "./contextapi/machine_ops_lib" }
net_ctrl_client = { path = "./contextapi/net_ctrl_client" }
net_ctrl_client_wrapper = { path = "./contextapi/net_ctrl_client_wrapper" }
nom = { version = "8.0.0", default-features = false, features = ["std"] }
opentelemetry = { version = "0.27.1", default-features = false, features = [
  "trace",
  "logs",
  "metrics",
  "internal-logs",
] }
opentelemetry_sdk = { version = "0.27.1", default-features = false, features = [
  "internal-logs",
  "logs",
  "metrics",
  "trace",
] }
pastey = { version = "0.2", default-features = false }
predicates = { version = "3", default-features = false }
rand = { version = "0.8.5", default-features = false, features = ["std"] }
regex = { version = "1.7.0", default-features = false }
remote-axum = { path = "./remote-hands/remote-axum/" }
remote_client = { path = "./contextapi/remote_client/" }
remote-init = { path = "./remote-hands/remote-init/" }
remote-serial = { path = "./remote-hands/remote-serial/" }
remote-usb = { path = "./remote-hands/remote-usb/" }
reqwest = { version = "0.13", default-features = false, features = [
  "multipart",
  "json",
  "stream",
  "cookies",
] }
reqwest-middleware = { version = "0.5", default-features = false, features = [
  "json",
  "multipart",
  "rustls",
] }
reqwest_cookie_store = { version = "0.10", default-features = false }
rppal = { version = "0.14.1", default-features = false, features = ["hal"] }
schemars = { version = "0.8", default-features = false, features = [
  "derive",
  "uuid",
  "uuid1",
] }
sd-notify = { version = "0.5.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
serde_repr = { version = "^0.1", default-features = false }
serde_with = { version = "3.8", default-features = false, features = ["std"] }
serial2-tokio = { version = "0.1", default-features = false, features = [
  "serde",
] }
sha2 = { version = "0.11.0", default-features = false }
sh1106 = { version = "0.5.0", default-features = false, features = [
  "graphics",
] }
ssd1306 = { version = "0.8.0", default-features = false, features = [
  "graphics",
] }
strum_macros = { version = "0.26", default-features = false }
