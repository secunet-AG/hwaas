] }
tracing-test = { version = "0.2", default-features = false }
trait-variant = { version = "0.1", default-features = false }
url = { version = "2.4.0", default-features = false, features = ["serde"] }
urlencoding = { version = "2.1.3", default-features = false }
usb-gadget = { version = "0.7", default-features = false }
