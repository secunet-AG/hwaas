scenarios:
  # Testing the cloud connect
  - name: titan2-test
    avg_job_schedule_time: 600
    expected_jobs_per_day: 100
    mean_job_exec_time: 1800
    hw_impacts:
      - on_name: bluefild
        factor: 1.0
      - on_name: server
        factor: 3.0
  # Used for development
  - name: titan2-dev
    avg_job_schedule_time: 600
    expected_jobs_per_day: 2
    mean_job_exec_time: 300000
    hw_impacts:
      - on_name: server
        factor: 1.0
      - on_name: bluefild
        factor: 2.0
  # QoS compat tests
  - name: qos-test
    avg_job_schedule_time: 600
    expected_jobs_per_day: 5
    mean_job_exec_time: 600
    hw_impacts:
      - on_name: mlx-cx6
        factor: 2.0
      - on_name: server
        factor: 2.0
      - on_name: sina-box
        factor: 10.0
  # Empty places for installing yet unknown BMRs
  - name: spare-inter-node
    avg_job_schedule_time: 600
    expected_jobs_per_day: 100
    mean_job_exec_time: 7200
    hw_impacts:
      - on_name: dummy
        factor: 2.0
  # Empty places for installing yet unknown BMRs
  - name: spare
    avg_job_schedule_time: 600
    expected_jobs_per_day: 100
    mean_job_exec_time: 7200
    hw_impacts:
      - on_name: dummy
        factor: 1.0
hardware:
