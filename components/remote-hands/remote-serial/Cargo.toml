[package]
name = "remote-serial"
edition = "2021"
default-run = "remote-serial"
version = "1.0.0"
license = "Apache-2.0"

[lib]
name = "remote_serial"
path = "src/lib.rs"

[[bin]]
name = "remote-serial"
path = "src/main.rs"

[[bin]]
name = "remote-serial-openapi-generator"
path = "src/bin/openapi-generator.rs"

[lints]
workspace = true

[dependencies]
aide = { version = "0.13", features = [
  "axum",
  "axum-extra",
  "axum-ws",
  "macros",
] }
axum = { version = "0.7", features = ["macros", "ws"] }
schemars = "0.8"
serde.workspace = true
serde_json = "1"
serial2-tokio = { version = "0.1", features = ["serde"] }
remote-axum.workspace = true
remote-init.workspace = true
tracing = "0.1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "tracing",
  "full",
] }
remote-hands-workspace-hack = { version = "0.1", path = "../remote-hands-workspace-hack" }
futures = "0.3.32"
tokio-util = "0.7.18"

[dev-dependencies]
tokio-test = "0.4.5"
bytes = "1.11.1"
tower = "0.5.3"
tokio-tungstenite = "0.24.0"
dashmap = "7.0.0-rc2"
axum-test = { version = "16.4.1", features = ["ws"] }
