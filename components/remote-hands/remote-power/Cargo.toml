[package]
authors.workspace = true
default-run = "remote-power"
description = "Manage power state of remote devices under test"
edition.workspace = true
license.workspace = true
name = "remote-power"
publish = false
readme = "README.md"
repository.workspace = true
version = "1.0.0"

[lib]
name = "remote_power"
path = "src/lib.rs"

[[bin]]
name = "remote-power"
path = "src/main.rs"

[[bin]]
name = "remote-power-openapi-generator"
path = "src/bin/openapi-generator.rs"

[lints]
workspace = true

[dependencies]
aide.workspace = true
axum.workspace = true
enum_dispatch.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
remote-axum.workspace = true
remote-init.workspace = true
tracing.workspace = true
tokio.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
