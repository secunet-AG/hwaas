[package]
name = "image_api"
version = "0.1.0"
edition = "2021"
license="Apache-2.0"

[lib]
name = "image_api"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
context_data_structures.workspace = true
axum.workspace = true
tracing = "0.1"
tower-http = { version = "0.6", default-features = false, features = [
  "trace",
  "limit",
] }
tokio = { version = "1.21.2", features = ["fs", "io-util", "io-std", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1.11", features = ["fs"] }
futures = "0.3"
sha2 = "0.10.6"
serde = { version = "1.0.152", features = ["derive"] }
uuid = { version = "1.2.2", features = ["v4", "fast-rng"] }
regex = "1.7.0"
bytes = "1.3.0"
async-std = "1.12.0"
aide.workspace = true
schemars = "0.8"
contextapi-workspace-hack = { version = "0.1", path = "../contextapi-workspace-hack" }
bytesize = { version = "2.0.1", features = ["serde"] }

[dev-dependencies]
tempfile = "3.3.0"
