[package]
name = "image_api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "image_api"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
context_data_structures.workspace = true
aide.workspace = true
axum = { workspace = true, features = ["macros"] }
chrono.workspace = true
db_interaction = { version = "0.1", path = "../db_interaction" }
diesel.workspace = true
tracing.workspace = true
tower-http = { version = "0.6", default-features = false, features = [
  "trace",
  "limit",
] }
tokio = { version = "1.21.2", features = ["fs", "io-util", "io-std", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1.11", features = ["fs"] }
futures.workspace = true
sha2 = "0.10.6"
serde.workspace = true
uuid.workspace = true
regex = "1.7.0"
bytes = "1.3.0"
schemars.workspace = true
contextapi-workspace-hack = { version = "0.1", path = "../contextapi-workspace-hack" }
bytesize = { version = "2.0.1", features = ["serde"] }
async-compression = { version = "0.4", default-features = false, features = [
  "zstd",
  "tokio",
] }
anyhow.workspace = true
static_assertions = "1.1.0"
thiserror = "2.0"
displaydoc = "0.2"

[dev-dependencies]
tempfile = "3.3.0"
assert_fs.workspace = true
# This crate is actually helpful since calling `tracing_subscriber...init()`
# multiple times within the same test binary causes a panic inside tracing
# since a global default subscriber has already been defined. We could check
# and handle this error, or we just use a crate that has figured this out for
# us.
test-log = { version = "0.2", default-features = false, features = [
  "trace",
  "color",
] }
