[package]
name = "ws-proxy-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "ws-proxy-client"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0.32", features = ["derive"] }
etherparse = "0.13.0"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
nom = "7.1.1"
sd-notify = "0.4.0"
thiserror = "2.0"
tokio = { version = "1.24.1", features = [
  "net",
  "macros",
  "rt-multi-thread",
  "io-util",
  "tracing",
  "sync",
] }
tokio-tun = "0.7.0"
tokio-tungstenite = { version = "0.26.1", features = ["stream"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.4.0"
ws-gateway-workspace-hack = { version = "0.1", path = "../ws-gateway-workspace-hack" }
