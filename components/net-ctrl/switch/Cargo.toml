[package]
edition = "2021"
name = "switch"
version = "0.1.0"
license="Apache-2.0"

[lib]
name = "switch"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.53"
base64 = "0.22.1"
dashmap = "5.3.4"
enum_dispatch = "0.3.8"
http = "1.1.0"
log = "0.4.21"
network_type_ids = { path = "../network_type_ids" }
reqwest = { version = "0.12.4", features = [
  "cookies",
  "json",
  "multipart",
  "stream",
] }
reqwest-middleware = { version = "0.4.0", features = ["json", "multipart"] }
reqwest_cookie_store = "0.8.0"
schemars = "0.8"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "1.0.80"
tokio = { version = "1.18.2", features = ["macros", "rt"] }
tracing = "0.1"
url = "2.2.2"
net-ctrl-workspace-hack = { version = "0.1", path = "../net-ctrl-workspace-hack" }
