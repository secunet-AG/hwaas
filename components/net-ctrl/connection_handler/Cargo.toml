[package]
edition = "2021"
name = "connection_handler"
version = "0.1.0"
license="Apache-2.0"

[lib]
name = "connection_handler"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.53"
inventory = { path = "../inventory" }
network_type_ids = { path = "../network_type_ids" }
switch = { path = "../switch" }
system_error = "0.2.0"
tokio = { version = "1.18.2", features = ["macros", "rt"] }
tracing = "0.1"
net-ctrl-workspace-hack = { version = "0.1", path = "../net-ctrl-workspace-hack" }
